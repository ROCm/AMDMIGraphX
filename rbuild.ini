[main]
cxx = ${rocm_path}/llvm/bin/clang++
cc = ${rocm_path}/llvm/bin/clang
deps =
    ROCm/rocm-recipes
    -f requirements.txt

[gh]
ignore =
    danmar/cppcheck
    ROCm/rocMLIR
deps =
    -f dev-requirements.txt
    oneapi-src/oneDNN@v1.7
define =
    CMAKE_C_COMPILER_LAUNCHER=${deps_dir}/bin/ccache
    CMAKE_CXX_COMPILER_LAUNCHER=${deps_dir}/bin/ccache
    MIGRAPHX_ENABLE_CPU=On
    BUILD_DEV=On

[develop]
cxx = ${rocm_path}/llvm/bin/clang++
cc = ${rocm_path}/llvm/bin/clang
deps =
    -f dev-requirements.txt
    oneapi-src/oneDNN@v1.7
define =
    CMAKE_C_COMPILER_LAUNCHER=${deps_dir}/bin/ccache
    CMAKE_CXX_COMPILER_LAUNCHER=${deps_dir}/bin/ccache
    MIGRAPHX_ENABLE_CPU=On
    BUILD_DEV=On

[gh-win-cpu]
ignore =
    ROCm/composable_kernel
    ROCm/rocMLIR
    danmar/cppcheck
    pcre
    facebook/zstd
    ccache
deps =
    -f dev-requirements.txt
    oneapi-src/oneDNN@v1.7
define =
    MIGRAPHX_ENABLE_CPU=On
    MIGRAPHX_ENABLE_GPU=Off
    MIGRAPHX_ENABLE_FPGA=Off
    MIGRAPHX_ENABLE_PYTHON=Off
    BUILD_DEV=On

global_define =
    CMAKE_POLICY_DEFAULT_CMP0091=NEW
    CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

[gh-win-gpu]
# ROCm (HIP, rocBLAS, hipBLASLt, MIOpen) comes from TheRock python wheels; the
# CI sets CC/CXX and CMAKE_PREFIX_PATH to point at that install, so no compiler
# is pinned here. rocMLIR is built from source on this path so the GPU backend
# keeps its MLIR pipeline. Composable Kernel is not yet ported to Windows.
ignore =
    ROCm/composable_kernel
    danmar/cppcheck
    pcre
    facebook/zstd
    ccache
deps =
    -f dev-requirements.txt
define =
    MIGRAPHX_ENABLE_GPU=On
    MIGRAPHX_ENABLE_CPU=Off
    MIGRAPHX_ENABLE_FPGA=Off
    MIGRAPHX_ENABLE_PYTHON=Off
    MIGRAPHX_USE_MIOPEN=On
    MIGRAPHX_USE_ROCBLAS=On
    MIGRAPHX_USE_HIPBLASLT=On
    MIGRAPHX_USE_COMPOSABLEKERNEL=Off
    BUILD_DEV=On

# consider ROCMLIR_SILENCE_WARNINGS=Off instead disabling assembly
# LLVM_DISABLE_ASSEMBLY_FILES builds rocMLIR's bundled LLVM without the
# hand-written SIMD BLAKE3 assembly. With clang-cl (MSVC=TRUE) LLVM assembles
# those .asm files via ml64.exe and leaks clang C/CXX flags onto them, which
# MASM rejects. The portable C BLAKE3 avoids MASM entirely (LLVM only uses
# BLAKE3 for internal hashing, so there is no functional impact).
global_define =
    CMAKE_POLICY_DEFAULT_CMP0091=NEW
    CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
    LLVM_DISABLE_ASSEMBLY_FILES=On
    LLVM_ENABLE_DIA_SDK=Off

[cibuild]
cxx = ${rocm_path}/llvm/bin/clang++
cc = ${rocm_path}/llvm/bin/clang
deps =
    -f dev-requirements.txt
define =
    CMAKE_C_COMPILER_LAUNCHER=${deps_dir}/bin/ccache
    CMAKE_CXX_COMPILER_LAUNCHER=${deps_dir}/bin/ccache
