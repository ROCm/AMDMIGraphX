[main]
cxx = ${rocm_path}/llvm/bin/clang++
cc = ${rocm_path}/llvm/bin/clang
deps =
    ROCm/rocm-recipes
    -f requirements.txt

[gh]
ignore =
    danmar/cppcheck
    ROCm/rocMLIR
    ROCm/rocmlirTriton
deps =
    -f dev-requirements.txt
    uxlfoundation/oneDNN@v3.9.1 -DONEDNN_BUILD_GRAPH=Off -DDNNL_BUILD_TESTS=Off -DDNNL_BUILD_EXAMPLES=Off
define =
    CMAKE_C_COMPILER_LAUNCHER=${deps_dir}/bin/ccache
    CMAKE_CXX_COMPILER_LAUNCHER=${deps_dir}/bin/ccache
    MIGRAPHX_ENABLE_CPU=On
    BUILD_DEV=On

[develop]
cxx = ${rocm_path}/llvm/bin/clang++
cc = ${rocm_path}/llvm/bin/clang
deps =
    -f dev-requirements.txt
    uxlfoundation/oneDNN@v3.9.1 -DONEDNN_BUILD_GRAPH=Off -DDNNL_BUILD_TESTS=Off -DDNNL_BUILD_EXAMPLES=Off
define =
    CMAKE_C_COMPILER_LAUNCHER=${deps_dir}/bin/ccache
    CMAKE_CXX_COMPILER_LAUNCHER=${deps_dir}/bin/ccache
    MIGRAPHX_ENABLE_CPU=On
    BUILD_DEV=On

[gh-win-cpu]
ignore =
    ROCm/composable_kernel
    ROCm/rocMLIR
    ROCm/rocmlirTriton
    danmar/cppcheck
    pcre
    facebook/zstd
    ccache
deps =
    -f dev-requirements.txt
    uxlfoundation/oneDNN@v3.9.1 -DONEDNN_BUILD_GRAPH=Off -DDNNL_BUILD_TESTS=Off -DDNNL_BUILD_EXAMPLES=Off
define =
    MIGRAPHX_ENABLE_CPU=On
    MIGRAPHX_ENABLE_GPU=Off
    MIGRAPHX_ENABLE_FPGA=Off
    MIGRAPHX_ENABLE_PYTHON=Off
    BUILD_DEV=On

global_define =
    CMAKE_POLICY_DEFAULT_CMP0091=NEW
    CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

[gh-win-gpu]
ignore =
    ROCm/composable_kernel
    danmar/cppcheck
    pcre
    facebook/zstd
    ccache
deps =
    -f dev-requirements.txt
define =
    MIGRAPHX_ENABLE_GPU=On
    MIGRAPHX_ENABLE_CPU=Off
    MIGRAPHX_ENABLE_FPGA=Off
    MIGRAPHX_ENABLE_PYTHON=Off
    MIGRAPHX_USE_MIOPEN=On
    MIGRAPHX_USE_ROCBLAS=On
    MIGRAPHX_USE_HIPBLASLT=On
    MIGRAPHX_USE_COMPOSABLEKERNEL=Off
    BUILD_DEV=On

global_define =
    CMAKE_POLICY_DEFAULT_CMP0091=NEW
    CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

[cibuild]
cxx = ${rocm_path}/llvm/bin/clang++
cc = ${rocm_path}/llvm/bin/clang
deps =
    -f dev-requirements.txt
define =
    CMAKE_C_COMPILER_LAUNCHER=${deps_dir}/bin/ccache
    CMAKE_CXX_COMPILER_LAUNCHER=${deps_dir}/bin/ccache
