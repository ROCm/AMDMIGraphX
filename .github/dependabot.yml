# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/docs/sphinx" # Location of package manifests
    schedule:
      interval: "daily"
    labels:
      - "documentation"
  - package-ecosystem: "pip"
    directory: "/tools/accuracy"
    schedule:
      interval: "daily"
  - package-ecosystem: "pip"
    directory: "/examples/vision/python_unet"
    schedule:
      interval: "daily"
  - package-ecosystem: "pip"
    directory: "/examples/vision/python_super_resolution"
    schedule:
      interval: "daily"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"

  # ── GitHub Actions: keep workflow action versions current ──────────────────
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions keep their own `uses:`
    # pins, so .github/actions has to be listed separately to get bumped.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
