name: MIGraphX Performance Tests

on:
  schedule:
    - cron: "0 7 * * 1-6"
  workflow_dispatch:
    inputs:
      rocm_release:
        description: ROCm Version
        required: true
        default: '7.2.3'
      result_number:
        description: Last N results
        required: true
        default: '10'
      model_timeout:
        description: If model in performance test script passes this threshold, it will be skipped
        required: true
        default: '30m'
      flags:
        description: -m for Max value; -s for Std dev; -r for Threshold file
        required: true
        default: '-r'
      model_path:
        description: Host path to NFS-backed models (ARC runner mount)
        required: false
        default: "/migraphx-models"
      perf_workspace:
        description: Writable NFS-backed workspace for reports/scratch (ARC runner mount)
        required: false
        default: "/mnt/migraphx-perf-work"
      runner_label:
        description: Self-hosted runner label (ARC scale set linux-migraphx-mi250-1)
        required: false
        default: "linux-migraphx-mi250-1"

concurrency:
  group: perftest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  call_reusable:
    if: github.repository == 'ROCm/AMDMIGraphX'
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    uses: ROCm/migraphx-benchmark/.github/workflows/perf-test.yml@testing
    with:
      rocm_release: ${{ github.event.inputs.rocm_release || '7.2.3' }}
      benchmark_utils_repo: 'AMD-ROCm-Internal/migraphx-benchmark-utils'
      performance_reports_repo: 'AMD-ROCm-Internal/migraphx-reports'
      performance_backup_repo: 'migraphx-benchmark/performance-backup'
      organization: 'AMD'
      result_number: ${{ github.event.inputs.result_number || '10' }}
      flags: ${{ github.event.inputs.flags || '-r' }}
      model_timeout: ${{ github.event.inputs.model_timeout || '30m' }}
      model_path: ${{ github.event.inputs.model_path || '/migraphx-models' }}
      perf_workspace: ${{ github.event.inputs.perf_workspace || '/mnt/migraphx-perf-work' }}
      runs_on: ${{ github.event.inputs.runner_label || 'linux-migraphx-mi250-1' }}
    secrets:
      BENCHMARK_UTILS_READ_TOKEN: ${{ secrets.BENCHMARK_UTILS_READ_TOKEN }}
